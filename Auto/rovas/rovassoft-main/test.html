<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ROVAS SOFT - Menu Jeux</title>
  <link rel="stylesheet" href="menu.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Hamburger Menu -->
  <div class="hamburger" id="hamburger">
    <div></div><div></div><div></div>
  </div>

  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3 class="sidebar-title">Menu</h3>
      <button class="close-sidebar" id="closeSidebar">✕</button>
    </div>
    <ul class="sidebar-menu">
      <li><a href="https://t.me/PARTRICK08" id="adminid"><span id="modeText">Contact admin</span></a></li>
      <li><a href="#" id="piraterBtn">🛠️ Pirater</a></li>
      <li><a href="https://t.me/ROVASOFFICIEL">❓ Aide</a></li>
    </ul>
  </div>

  <!-- Modal Pirater -->
  <div class="modal" id="piraterModal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Pirater un Jeu de Crash</h3>
        <button class="modal-close" id="modalClose">✕</button>
      </div>
      <div class="form-group">
        <label for="gameName">Nom du jeu</label>
        <input type="text" id="gameName" placeholder="Ex: Aviator, Crash X">
      </div>
      <div class="form-group">
        <label>3 derniers coefficients</label>
        <div class="coefficients-grid">
          <input type="number" id="coeff1" placeholder="1.25" step="0.01">
          <input type="number" id="coeff2" placeholder="2.50" step="0.01">
          <input type="number" id="coeff3" placeholder="1.80" step="0.01">
        </div>
      </div>
      <button class="predict-btn" id="predictBtn">Prédire la cote</button>
      <div class="prediction-result" id="predictionResult" style="display: none;">
        <div class="prediction-coefficient" id="predictedCoeff">-</div>
        <div class="prediction-time" id="predictedTime">-</div>
      </div>
    </div>
  </div>

  <div class="wrapper">
    <header class="header">
      <img class="gamepad-bg" src="gamepad-bg.webp" alt="gamepad-bg" />
      <img class="gamepad" src="gamepad.webp" alt="gamepad" />
      <h2 class="header__title">ROVAS SOFT</h2>
      <p class="header__text">Prédictor</p>
    </header>

    <div class="games-list" id="gamesList" style="box-shadow: 0px -15px 20px 10px #00dcdc3b; border-top: 5px solid #00dcdc;">
      <img src="ellipce.webp" class="games-list__ellipce">
      <!-- Games will be loaded dynamically from JSON -->
    </div>
  </div>

  <script>
    // Sidebar & Modal
    const hamburger = document.getElementById('hamburger');
    const sidebar = document.getElementById('sidebar');
    const closeSidebar = document.getElementById('closeSidebar');
    const piraterBtn = document.getElementById('piraterBtn');
    const piraterModal = document.getElementById('piraterModal');
    const modalClose = document.getElementById('modalClose');

    hamburger.addEventListener('click', () => sidebar.classList.add('open'));
    closeSidebar.addEventListener('click', () => sidebar.classList.remove('open'));
    piraterBtn.addEventListener('click', () => {
      piraterModal.style.display = 'flex';
      sidebar.classList.remove('open');
    });
    modalClose.addEventListener('click', () => piraterModal.style.display = 'none');
    window.addEventListener('click', e => {
      if (e.target === piraterModal) piraterModal.style.display = 'none';
    });

    // Prediction Logic
    document.getElementById('predictBtn').addEventListener('click', () => {
      const coeff = (Math.random() * 5 + 1).toFixed(2);
      document.getElementById('predictedCoeff').textContent = coeff;
      document.getElementById('predictedTime').textContent = `Dans ${Math.floor(Math.random() * 60)} secondes`;
      document.getElementById('predictionResult').style.display = 'block';
    });

    // Load games from JSON
    fetch('admingjhdsgffx/games.json')
      .then(res => res.json())
      .then(savedGames => {
        const gamesListDiv = document.getElementById('gamesList');
        savedGames.forEach(game => {
          const gameDiv = document.createElement('div');
          gameDiv.classList.add('game-list__game');

          const gameLink = document.createElement('a');
          gameLink.href = game.link;

          const gameImg = document.createElement('img');
          gameImg.src = game.img;
          gameImg.alt = game.alt;
          gameImg.classList.add('game-list__img');

          const gameTitle = document.createElement('p');
          gameTitle.classList.add('game-list__title');
          gameTitle.textContent = game.title;

          gameLink.appendChild(gameImg);
          gameDiv.appendChild(gameLink);
          gameDiv.appendChild(gameTitle);

          gamesListDiv.appendChild(gameDiv);
        });
      })
      .catch(err => console.error("Failed to load games JSON:", err));
  </script>
</body>
</html>
